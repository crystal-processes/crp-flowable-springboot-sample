# Spring AI Configuration
# This configuration enables AI capabilities in your Flowable application
# Requires a running LLM backend (e.g., Ollama)

# Ollama Configuration (default)
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.model=llama2

# Alternative: OpenAI Configuration (if using OpenAI instead)
# spring.ai.openai.api-key=${OPENAI_API_KEY}
# spring.ai.openai.model=gpt-4

# Alternative: Hugging Face Configuration
# spring.ai.huggingface.api-key=${HF_API_KEY}
# spring.ai.huggingface.model=mistral-7b

# Chat client timeout (in milliseconds)
spring.ai.chat.client.request-timeout=30000

